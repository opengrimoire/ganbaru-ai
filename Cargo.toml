[workspace]
resolver = "3"
members = [
  "apps/client/src-tauri",
  "apps/client/src-tauri/app",
  "crates/ganbaru-chat",
  "crates/ganbaru-chat-contracts",
  "crates/ganbaru-chat-providers",
  "crates/ganbaru-db",
  "crates/ganbaru-focus",
  "crates/ganbaru-mobile-documents",
  "crates/ganbaru-mobile-doomscrolling",
  "crates/ganbaru-mobile-media",
  "crates/ganbaru-mobile-notifications",
  "crates/ganbaru-native-messaging",
  "crates/ganbaru-notes",
  "crates/ganbaru-working-folders",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
authors = ["Ganbaru AI"]
license = "AGPL-3.0-only"

[workspace.lints.clippy]
# Nested guards and let-chains are both valid; choose by readability and scope.
collapsible_if = "allow"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
ammonia = "4.1.4"
axum = "0.8.8"
base64 = "0.22.1"
block2 = "0.6.2"
cairo-rs = { version = "0.18.5", features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
flate2 = "1.1.9"
ganbaru-mobile-documents = { path = "crates/ganbaru-mobile-documents" }
ganbaru-mobile-doomscrolling = { path = "crates/ganbaru-mobile-doomscrolling" }
ganbaru-mobile-media = { path = "crates/ganbaru-mobile-media" }
ganbaru-mobile-notifications = { path = "crates/ganbaru-mobile-notifications" }
gtk = "0.18"
keyring = "4.1.5"
libc = "0.2"
notify = "=8.2.0"
notify-rust = "4"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSBitmapImageRep",
  "NSImage",
  "NSImageRep",
  "NSRunningApplication",
  "NSResponder",
  "NSWorkspace",
  "NSWindow",
  "libc",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFString",
  "objc2",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSObject",
  "NSGeometry",
  "NSObjCRuntime",
  "NSString",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "block2",
  "WKSnapshotConfiguration",
  "WKWebView",
] }
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rmcp = { version = "3.0.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rodio = { version = "0.22.2", default-features = false, features = [
  "playback",
  "symphonia-flac",
  "symphonia-mp3",
  "symphonia-isomp4",
  "symphonia-aac",
  "symphonia-alac",
  "symphonia-ogg",
  "symphonia-vorbis",
  "symphonia-wav",
  "symphonia-pcm",
] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
qrcode = { version = "0.14.1", default-features = false }
quircs = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "json"] }
tauri = { version = "~2.11.1" }
tauri-build = { version = "~2.6.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.48", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
wayland-client = "0.31.14"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
webkit2gtk = "2.0.2"
webview2-com = "0.38.2"
windows = { version = "0.61", features = [
  "Foundation",
  "Media",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
x11rb = "0.13.2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = 1
